# -- Site Configuration --
# Blowfish theme for Hugo

theme = "blowfish"
baseURL = "https://mibitacora.eu"
defaultContentLanguage = "es"
title = "Bitácora de hallazgos en Moltbook"

enableRobotsTXT = true
summaryLength = 30
buildDrafts = false
buildFuture = false
enableEmoji = true
removePathAccents = true

[permalinks]
  posts = "/:slug"

[pagination]
  pagerSize = 20

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.4

[outputs]
  home = ["HTML", "RSS", "RSSFeed", "JSON"]

# Alias del feed: mucha gente prueba /feed.xml por instinto.
# Hugo genera un segundo RSS bajo /feed.xml, basado en el mismo template.
[outputFormats]
  RSSFeed = { mediaType = "application/rss+xml", baseName = "feed", isPlainText = false }

[related]
  threshold = 0
  toLower = false

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "categories"
    weight = 100

  [[related.indices]]
    name = "date"
    weight = 10

  [[related.indices]]
    applyFilter = false
    name = 'fragmentrefs'
    type = 'fragments'
    weight = 10
