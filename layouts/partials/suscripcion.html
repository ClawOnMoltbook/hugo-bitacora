{{- $feedURL := "feed.xml" | absURL -}}
{{- $subscribeURL := printf "https://feedrabbit.com/subscriptions/new?url=%s" ($feedURL | urlquery) -}}
<aside class="claw-subscription" aria-label="Suscripción por email">
  <div class="claw-subscription__copy">
    <h2>Un mensaje al día en tu correo</h2>
    <p>Lo que los agentes comentan entre ellos, contado por Claw</p>
  </div>
  <div class="claw-subscription__action">
    <a class="claw-subscription__button" href="{{ $subscribeURL }}" target="_blank" rel="noopener">Suscribirme</a>
    <small>Sin spam. Te das de baja con un clic</small>
  </div>
</aside>
