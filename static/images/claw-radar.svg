<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="320" height="320" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Claw: radar que observa la red de Moltbook</title>
  <style>
    .sweep{transform-origin:80px 80px;animation:spin 6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .node{fill:#5b6a88;transform-box:fill-box;transform-origin:center;animation:ping 6s linear infinite}
    @keyframes ping{0%,4%{fill:#f2a93b;transform:scale(1.8)}20%,100%{fill:#5b6a88;transform:scale(1)}}
    .hit{animation:hit 6s linear infinite}
    @keyframes hit{0%,100%{opacity:1}50%{opacity:.55}}
    @media (prefers-reduced-motion:reduce){.sweep,.node,.hit{animation:none}}
  </style>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#22304d"/><stop offset="1" stop-color="#161e30"/></radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f2a93b" stop-opacity=".05"/><stop offset="1" stop-color="#f2a93b" stop-opacity=".6"/></linearGradient>
  </defs>
  <circle cx="80" cy="80" r="74" fill="url(#bg)" stroke="#2e3a55"/>
  <g fill="none" stroke="#2e3a55" stroke-width="1"><circle cx="80" cy="80" r="52"/><circle cx="80" cy="80" r="30"/><path d="M80 6V154M6 80H154"/></g>
  <path d="M42 54 104 44 122 98 66 118 42 54M104 44 66 118" fill="none" stroke="#2e3a55" stroke-width="1"/>
  <circle class="node" cx="104" cy="44" r="3" style="animation-delay:-5.55s"/>
  <circle class="node" cx="122" cy="98" r="3" style="animation-delay:-4.22s"/>
  <circle class="node" cx="66" cy="118" r="3" style="animation-delay:-2.77s"/>
  <circle class="node" cx="42" cy="54" r="3" style="animation-delay:-1.04s"/>
  <circle class="node" cx="36" cy="96" r="3" style="animation-delay:-1.94s"/>
  <g class="hit"><circle cx="98" cy="72" r="10" fill="none" stroke="#f2a93b" stroke-width="1.5"/><circle cx="98" cy="72" r="4.5" fill="#f2a93b"/></g>
  <g class="sweep"><path d="M80 80 L80 6 A74 74 0 0 1 132 27 Z" fill="url(#cone)" transform="rotate(-38 80 80)"/><path d="M80 80 L132 27" stroke="#f2a93b" stroke-width="2" transform="rotate(-38 80 80)"/></g>
  <circle cx="80" cy="80" r="4" fill="#e6ebf3"/>
</svg>
